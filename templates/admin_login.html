{% extends 'base.html' %}

{% block title %}
Admin Login
{% endblock %}

{% block content %}

<style>

.admin-login-page {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 15px;
    background: linear-gradient(135deg, #0f172a, #312e81);
}

.admin-login-card {
    width: 100%;
    max-width: 450px;
    background: #ffffff;
    border: none;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

.admin-header {
    background: linear-gradient(135deg, #111827, #4c1d95);
    color: white;
    text-align: center;
    padding: 35px 25px;
}

.admin-icon {
    width: 75px;
    height: 75px;
    margin: 0 auto 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;

    font-size: 32px;
}

.admin-header h3 {
    margin: 0;
    font-weight: 700;
}

.admin-header p {
    margin: 7px 0 0;
    color: #d1d5db;
    font-size: 14px;
}

.admin-body {
    padding: 35px;
}

.form-label {
    font-weight: 600;
    color: #1f2937;
}

.form-control {
    height: 48px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 10px 14px;
    transition: 0.2s;
}

.form-control:focus {
    border-color: #6d28d9;
    box-shadow: 0 0 0 0.2rem rgba(109,40,217,0.15);
}

.login-btn {
    height: 48px;
    border: none;
    border-radius: 10px;

    background: linear-gradient(135deg, #4c1d95, #7c3aed);

    color: white;
    font-weight: 700;
    font-size: 16px;

    transition: 0.2s;
}

.login-btn:hover {
    background: linear-gradient(135deg, #3b0764, #6d28d9);
    transform: translateY(-1px);
    color: white;
}

.admin-footer {
    text-align: center;
    margin-top: 20px;
    color: #9ca3af;
    font-size: 13px;
}

.security-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;

    background: #f3f4f6;
    color: #4b5563;

    padding: 7px 12px;
    border-radius: 20px;
    font-size: 12px;
}

</style>


<div class="admin-login-page">

    <div class="admin-login-card">

        <!-- Admin Header -->

        <div class="admin-header">

            <div class="admin-icon">

                <i class="bi bi-shield-lock-fill"></i>

            </div>

            <h3>
                Admin Login
            </h3>

            <p>
                Secure administrator access
            </p>

        </div>


      

        <div class="admin-body">

            <form method="POST">

                {% csrf_token %}


               

                <div class="mb-4">

                    <label class="form-label">
                        <i class="bi bi-person-fill"></i>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter admin username"
                        required>

                </div>



                <div class="mb-4">

                    <label class="form-label">
                        <i class="bi bi-lock-fill"></i>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter admin password"
                        required>

                </div>


                

                <button
                    type="submit"
                    class="btn login-btn w-100">

                    <i class="bi bi-box-arrow-in-right"></i>
                    Login to Admin Panel

                </button>

            </form>


            

            <div class="admin-footer">

                <span class="security-badge">

                    <i class="bi bi-shield-check"></i>

                    Protected Admin Area

                </span>

            </div>

        </div>

    </div>

</div>

{% endblock %}
